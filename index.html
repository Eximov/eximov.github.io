<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camille Roussel — Art Director</title>
    <style>
        /* 1. DÉCLARATION DE LA POLICE COCONAT REGULAR */
        @font-face {
            font-family: 'Coconat';
            src: url('Coconat-Regular.woff2') format('woff2'),
                 url('Coconat-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        /* 2. RESET & STYLES GENERAUX */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #83b6e8; /* Le bleu de votre maquette */
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding: 24px;
        }

        /* 3. LE BANDEAU BLANC (HEADER) */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            width: 100%;
            max-width: 800px;
            background-color: #ffffff; /* Fond blanc du bandeau */
            margin: 0 auto 24px;
            padding: 18px 32px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            text-decoration: none;
            color: #000000;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #000000;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        /* 4. CONTENU CENTRAL (HERO) */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-bottom: 60px;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .title {
            font-family: 'Coconat', serif; /* Application de Coconat */
            font-size: 5.5rem;
            font-weight: 400; /* Utilisation de la version Regular */
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -1px;
            max-width: 900px;
            position: relative;
        }

        .circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(0, 0, 0, 0.15);
            margin: 0 auto 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* 5. RESPONSIVE DESIGN */
        footer {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 16px;
            padding: 14px 20px;
            text-align: center;
            color: rgba(0, 0, 0, 0.7);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            header {
                padding: 14px 20px;
            }

            .nav-links {
                gap: 16px;
            }

            .nav-links a {
                font-size: 0.85rem;
            }

            .subtitle {
                font-size: 1.1rem;
                margin-bottom: 16px;
            }

            .title {
                font-size: 3rem;
                letter-spacing: -1px;
            }
        }
    </style>
</head>
<body>

    <!-- Le bandeau blanc -->
    <header>
        <nav>
            <a href="index.html" class="logo">Camille Roussel la bg</a>
            <ul class="nav-links">
                <li><a href="projects.html">PROJECTS</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <!-- Le contenu de la page -->
    <main>
        <p class="subtitle">Digital & Branding & Design & Me</p>
        <div class="circle"></div>
        <h1 class="title">Art Director<br>Based in Paris</h1>
    </main>

    <footer>
        made by myself
    </footer>

</body>
</html>
