<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camille Roussel — Art Director</title>
    <style>
        /* 1. RESET & VARIABLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #83b6e8; /* Le bleu exact de votre maquette */
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding: 24px;
        }

        /* 2. NAVIGATION BAR (BANDEAU) */
        header {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            margin: 0 auto;
            padding: 18px 32px;
            border-radius: 4px; /* Léger arrondi comme sur l'image */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            text-decoration: none;
            color: #000000;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #000000;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease;
        }

        /* Effet discret au survol pour le côté premium */
        .nav-links a:hover {
            opacity: 0.6;
        }

        /* 3. HERO CONTENT (CENTRE DE LA PAGE) */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-bottom: 60px; /* Aligne visuellement par rapport au bandeau */
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -2px;
            max-width: 900px;
        }

        /* 4. RESPONSIVE DESIGN (S'ADAPTE AUX MOBILES) */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            header {
                padding: 14px 20px;
            }

            .nav-links {
                gap: 16px;
            }

            .nav-links a {
                font-size: 0.85rem;
            }

            .subtitle {
                font-size: 1.1rem;
                margin-bottom: 16px;
            }

            .title {
                font-size: 3rem;
                letter-spacing: -1px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Camille Roussel</a>
            <ul class="nav-links">
                <li><a href="projects.html">PROJECTS</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p class="subtitle">Digital & Branding</p>
        <h1 class="title">Art Director<br>Based in Paris</h1>
    </main>

</body>
</html>
